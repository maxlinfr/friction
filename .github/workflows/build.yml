# One macOS job: unsigned device .ipa (for Sideloadly) + simulator build with screenshots.
# Download artifacts from the run's "Artifacts" section.
# macOS minutes are expensive (10x on private repos): keep this to ONE macOS job.
name: build

on:
  push:
    paths-ignore:
      - "**.md"
      - "analysis/**"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether the app bundle is affected. Only Friction/** (includes friction.js, which is
  # bundled), project.yml and the workflows need the macOS job; tests/scripts/npm changes don't.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'Friction/**'
              - 'project.yml'
              - '.github/workflows/**'

  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:userscripts
      - run: npx playwright install --with-deps webkit
      - run: npm test # CI=true -> forbidOnly + html report
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  ios:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned, device)
        run: |
          xcodebuild -project Friction.xcodeproj -scheme Friction -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Friction.app Payload/
          zip -qry Friction-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Friction-unsigned-ipa
          path: Friction-unsigned.ipa

      - name: Build (simulator)
        run: |
          xcodebuild -project Friction.xcodeproj -scheme Friction -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Boot simulator, install, launch, screenshot
        run: |
          mkdir -p screenshots
          # Pick the first available iPhone (newest runtime listed last, so take the last).
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x["udid"] for rt,l in sorted(d.items()) if "iOS" in rt for x in l if x["name"].startswith("iPhone")]
          print(c[-1] if c else "")')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available"; xcrun simctl list devices available; exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/Friction.app
          xcrun simctl launch "$UDID" com.example.friction
          for i in 1 2 3 4; do
            sleep 12
            xcrun simctl io "$UDID" screenshot "screenshots/shot-$i.png"
          done
          ls -l screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
