# XcodeGen spec: generates Friction.xcodeproj (`xcodegen generate`).
# Keeps the project buildable without ever opening Xcode — CI does it on a cloud Mac.
name: Friction
options:
  bundleIdPrefix: com.example          # change to your own reverse-domain before App Store
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Friction:
    type: application
    platform: iOS
    sources:
      - path: Friction
        excludes:
          - "Resources/**"
      - path: Friction/Resources
        buildPhase: resources
    info:
      path: Friction/Info.plist
      properties:
        CFBundleDisplayName: Friction
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.friction
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
